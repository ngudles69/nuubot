[project]
name = "nuubot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3",
  "pydantic>=2",
  "sqlalchemy>=2",
  "websockets>=15.0.1",
]

[project.scripts]
nuubot-cli = "nuubot.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.0",
]
